<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PapersFoundHere Status</title>
  <link rel="icon" href="https://papersfoundhere.rf.gd/favicon.ico?i=1" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Lexend', Georgia, serif;
      background: #fafafa;
      margin: 0;
      padding: 0;
      color: #222;
    }
    header {
      background: #351c75;
      color: white;
      text-align: center;
      padding: 20px;
    }
    header img { margin-bottom: 10px; height: 50px; }
    h1, h2 { margin: 10px 0; }

    .status-banner {
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
      margin: 20px auto;
      padding: 12px;
      border-radius: 8px;
      width: 80%;
      color: white;
    }
    .status-green { background: #4CAF50; }
    .status-yellow { background: #FFC107; color: black; }
    .status-red { background: #F44336; }
    .status-blue { background: #2196F3; }

    .service-list {
      width: 80%;
      margin: 0 auto 20px auto;
      border-collapse: collapse;
      background: white;
      border-radius: 6px;
      overflow: hidden;
    }
    .service-list td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }
    .service-list td:last-child { text-align: right; }
    .service-list a { color: #351c75; text-decoration: none; font-weight: 600; }

    .indicator {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    .incident {
      width: 80%;
      margin: 20px auto;
      padding: 15px;
      border: 1px solid #ddd;
      border-left: 6px solid;
      background: white;
      border-radius: 6px;
    }
    .incident-yellow { border-left-color: #FFC107; }
    .incident-red { border-left-color: #F44336; }
    .incident-blue { border-left-color: #2196F3; }

    .timeline-entry {
      margin: 6px 0;
      font-size: 0.9em;
      color: #555;
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: center; /* center horizontally */
      gap: 12px; /* space between logo and text */
    }

    .header-container img {
      height: 50px; /* logo size */
    }

    #history { width: 80%; margin: 20px auto; }
  </style>
</head>
<body>
  <header>
    <img src="../favicon.ico" alt="Logo">
    <h1>PapersFoundHere System Status</h1>
  </header>

  <!-- Global Status -->
  <div id="globalStatus" class="status-banner">Loading...</div>

  <!-- Services -->
  <section>
    <h2 style="text-align:center;">Services</h2>
    <table id="services" class="service-list"></table>
  </section>

  <!-- Active Incidents -->
  <section id="activeSection">
    <h2 style="text-align:center;">Active Incidents & Maintenance</h2>
    <div id="activeIncidents"></div>
  </section>

  <!-- History -->
  <section id="historySection">
    <h2 style="text-align:center;">Past Incidents</h2>
    <div id="history"></div>
  </section>

  <script>
    async function loadStatus() {
      try {
        const res = await fetch("status.json?_=" + Date.now()); // cache-bust
        const data = await res.json();

        // Global Status
        const global = document.getElementById("globalStatus");
        global.textContent = data.global?.message || "No status available";
        global.className = `status-banner status-${data.global?.level || "green"}`;

        // Services
        const services = document.getElementById("services");
        services.innerHTML = "";
        (data.services || []).forEach(svc => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td><a href="${svc.link}" target="_blank">${svc.name}</a></td>
            <td><span class="indicator" style="background:${statusColor(svc.status)}"></span>${svc.status}</td>
          `;
          services.appendChild(row);
        });

        // Active Incidents
        const activeSection = document.getElementById("activeSection");
        const active = document.getElementById("activeIncidents");
        active.innerHTML = "";
        if (!data.active || data.active.length === 0) {
          activeSection.style.display = "none";
        } else {
          activeSection.style.display = "block";
          data.active.forEach(inc => {
            const div = document.createElement("div");
            div.className = `incident incident-${incidentColor(inc.type)}`;
            div.innerHTML = `<h3>${inc.service} - ${inc.title}</h3>`;
            inc.timeline.forEach(entry => {
              const e = document.createElement("div");
              e.className = "timeline-entry";
              e.innerHTML = `${entry.time} - <b>${entry.status}:</b> ${entry.message}`;
              div.appendChild(e);
            });
            active.appendChild(div);
          });
        }

        // History
        const historySection = document.getElementById("historySection");
        const history = document.getElementById("history");
        history.innerHTML = "";
        if (!data.history || data.history.length === 0) {
          historySection.style.display = "none";
        } else {
          historySection.style.display = "block";
          data.history.forEach(h => {
            const div = document.createElement("div");
            div.className = "timeline-entry";
            div.innerHTML = `${h.date} - <b>${h.service}</b>: ${h.title}`;
            history.appendChild(div);
          });
        }

      } catch (err) {
        console.error("Failed to load status:", err);
        document.getElementById("globalStatus").textContent = "Failed to load status";
      }
    }

    function statusColor(status) {
      switch ((status || "").toLowerCase()) {
        case "operational": return "#4CAF50";
        case "degraded performance": return "#FFC107";
        case "major outage": return "#F44336";
        case "scheduled maintenance": return "#2196F3";
        default: return "#999";
      }
    }

    function incidentColor(type) {
      switch (type) {
        case "incident": return "yellow";
        case "outage": return "red";
        case "maintenance": return "blue";
        default: return "yellow";
      }
    }

    loadStatus();
    setInterval(loadStatus, 60000); // refresh every minute
  </script>
</body>
</html>
